# FlexCloud Apache Virtual Host Configuration
# ============================================
# This configuration sets up wildcard subdomain support for multi-tenant architecture
# and reverse proxying to Laravel backend and Next.js frontend

# Enable required modules (run these commands first):
# sudo a2enmod proxy
# sudo a2enmod proxy_http
# sudo a2enmod proxy_wstunnel
# sudo a2enmod rewrite
# sudo a2enmod ssl
# sudo a2enmod headers

# ============================================
# MAIN CONFIGURATION - Local Development
# ============================================
# Place this in /etc/apache2/sites-available/flexcloud.conf
# Then run: sudo a2ensite flexcloud.conf && sudo systemctl reload apache2

<VirtualHost *:80>
    # Wildcard subdomain support - handles *.flexcloud.test and flexcloud.test
    ServerName flexcloud.test
    ServerAlias *.flexcloud.test
    
    # Document Root (for static assets if needed)
    DocumentRoot /var/www/flexcloud/public
    
    # Logging
    ErrorLog ${APACHE_LOG_DIR}/flexcloud-error.log
    CustomLog ${APACHE_LOG_DIR}/flexcloud-access.log combined
    
    # Enable RewriteEngine
    RewriteEngine On
    
    # ==========================================
    # API Routes - Proxy to Laravel Backend
    # ==========================================
    # All /api/* requests go to Laravel (port 8000)
    ProxyPreserveHost On
    
    # API endpoints
    <Location /api>
        ProxyPass http://127.0.0.1:8000/api
        ProxyPassReverse http://127.0.0.1:8000/api
    </Location>
    
    # Laravel Sanctum/CSRF routes
    <Location /sanctum>
        ProxyPass http://127.0.0.1:8000/sanctum
        ProxyPassReverse http://127.0.0.1:8000/sanctum
    </Location>
    
    # Storage/uploads
    <Location /storage>
        ProxyPass http://127.0.0.1:8000/storage
        ProxyPassReverse http://127.0.0.1:8000/storage
    </Location>
    
    # ==========================================
    # Frontend - Proxy to Next.js Dev Server
    # ==========================================
    # All other requests go to Next.js (port 3000)
    
    # Next.js WebSocket for HMR (Hot Module Replacement)
    <Location /_next/webpack-hmr>
        ProxyPass ws://127.0.0.1:3000/_next/webpack-hmr
        ProxyPassReverse ws://127.0.0.1:3000/_next/webpack-hmr
    </Location>
    
    # Next.js static files
    <Location /_next>
        ProxyPass http://127.0.0.1:3000/_next
        ProxyPassReverse http://127.0.0.1:3000/_next
    </Location>
    
    # Default - All other routes to Next.js
    ProxyPass / http://127.0.0.1:3000/
    ProxyPassReverse / http://127.0.0.1:3000/
    
    # ==========================================
    # Headers for subdomain resolution
    # ==========================================
    # Pass the original host header to backend for tenant resolution
    RequestHeader set X-Forwarded-Host %{HTTP_HOST}s
    RequestHeader set X-Original-Host %{HTTP_HOST}s
    
    # CORS Headers (if needed)
    Header always set Access-Control-Allow-Origin "*"
    Header always set Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS, PATCH"
    Header always set Access-Control-Allow-Headers "Authorization, Content-Type, X-Requested-With, X-CSRF-Token"
    
    # Security Headers
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set X-XSS-Protection "1; mode=block"
</VirtualHost>

# ============================================
# SSL/HTTPS CONFIGURATION (Optional for local dev)
